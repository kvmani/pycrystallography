[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycrystallography"
version = "0.2.0"
description = "Modern composite diffraction analysis orchestrator leveraging orix and pymatgen"
readme = "README.md"
authors = [
  { name = "PyCrystallography Developers" }
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "orix>=0.13",
  "pymatgen>=2025.10",
  "pydantic>=2.0",
  "typer>=0.9",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.3",
  "mypy>=1.8",
]
docs = [
  "sphinx>=8.0",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
pcg = "pycrystallography.cli.main:cli"

[project.entry-points."pycrystallography.calculators"]
tem = "pycrystallography.analysis.calculators.composite:CompositeTEMCalculator"

[tool.hatch.build.targets.sdist]
include = ["pycrystallography", "data", "docs", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["pycrystallography"]

[tool.ruff]
line-length = 100

[tool.mypy]
packages = ["pycrystallography"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
